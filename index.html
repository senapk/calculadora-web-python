<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Python</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #111827;
        }

        .calculadora {
            width: min(360px, calc(100% - 32px));
            box-sizing: border-box;
            padding: 24px;
            border-radius: 16px;
            background: #1f2937;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input,
        select,
        button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 18px;
            cursor: pointer;
            color: white;
            background: #2563eb;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            min-height: 24px;
            margin: 18px 0 0;
            text-align: center;
            font-size: 20px;
        }

        .erro {
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <main class="calculadora">
        <h1>Calculadora Python</h1>

        <label for="numero-a">Primeiro numero</label>
        <input id="numero-a" type="number" step="any" value="0">

        <label for="operacao">Operacao</label>
        <select id="operacao">
            <option value="soma">Soma</option>
            <option value="subtracao">Subtracao</option>
            <option value="multiplicacao">Multiplicacao</option>
            <option value="divisao">Divisao</option>
        </select>

        <label for="numero-b">Segundo numero</label>
        <input id="numero-b" type="number" step="any" value="0">

        <button id="calcular" type="button">Calcular</button>
        <p id="resultado" role="status" aria-live="polite"></p>
    </main>

    <script>
        const numeroA = document.getElementById("numero-a");
        const numeroB = document.getElementById("numero-b");
        const operacao = document.getElementById("operacao");
        const resultado = document.getElementById("resultado");
        const botao = document.getElementById("calcular");

        async function calcular() {
            resultado.className = "";
            resultado.textContent = "Calculando...";

            try {
                const resposta = await fetch("/api/calcular", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        operacao: operacao.value,
                        a: Number(numeroA.value),
                        b: Number(numeroB.value)
                    })
                });
                const dados = await resposta.json();

                if (!resposta.ok) {
                    resultado.className = "erro";
                    resultado.textContent = dados.erro;
                    return;
                }

                resultado.textContent = `Resultado: ${dados.resultado}`;
            } catch (erro) {
                resultado.className = "erro";
                resultado.textContent = "Nao foi possivel conectar ao servidor.";
            }
        }

        botao.addEventListener("click", calcular);
    </script>
</body>
</html>
